alertmanager:
  enabled: false
prometheus-pushgateway:
  enabled: false
kube-state-metrics:
  enabled: false
prometheus-node-exporter:
  enabled: false
extraScrapeConfigs: |
  - job_name: metrics
    scrape_interval: 15s
    static_configs:
      - targets: ["metrics.default.svc.cluster.local:8000"]
